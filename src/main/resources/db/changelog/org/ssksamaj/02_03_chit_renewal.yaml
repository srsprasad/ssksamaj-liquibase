databaseChangeLog:
  - changeSet:
      id: "001"
      author: srsprasad 
      runOnChange: true
      runAlways: false
      comment: "This change in for Table ChitRenewal"

      changes:
        - createTable:
            tableName: CHIT_RNWL
            columns:
              - column:
                  name: ID
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: CHIT_ID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: RNWL_CNT
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: STRT_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: END_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: CRTD_DATE
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: CHIT_RNWL
            baseColumnNames: CHIT_ID
            constraintName: CHIT_RNWL_FK_01
            referencedTableName: CHIT
            referencedColumnNames: ID
            onDelete: CASCADE
