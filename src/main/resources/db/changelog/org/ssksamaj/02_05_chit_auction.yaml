databaseChangeLog:
  - changeSet:
      id: "001"
      author: srsprasad 
      runOnChange: true
      runAlways: false
      comment: "This change in for Table Chit Auction"

      changes:
        - createTable:
            tableName: CHIT_AUCT
            columns:
              - column:
                  name: ID
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: RNWL_ID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: RNWL_MEMR_ID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: AUCT_CNT
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: AUCT_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: AUCT_AMT
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: AUCT_ADJ_AMT
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: CRTD_DATE
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPTD_DATE 
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: CHIT_AUCT
            baseColumnNames: RNWL_ID
            constraintName: CHIT_AUCT_FK_01
            referencedTableName: CHIT_RNWL
            referencedColumnNames: ID
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: CHIT_AUCT
            baseColumnNames: RNWL_MEMR_ID
            constraintName: CHIT_AUCT_FK_02
            referencedTableName: CHIT_MEMR_ASSN
            referencedColumnNames: ID
            onDelete: CASCADE
